version: 2.1

jobs:
  HOME_LOCALE_NARROW:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Compute checksum D
          command: |
            mkdir -p /tmp/baz
            set +o pipefail 2>/dev/null; awk 'BEGIN{printf "{"; for(i=1;i<=1000;i++) {if(i>1) printf ","; printf "\"k%d\":%d",i,i}; print "}"}' > /tmp/baz/TCP-URL; true
            echo "sha=$(sha256sum /tmp/baz/TCP-URL | awk '{print substr($1,1,10)}')"
      - persist_to_workspace:
          root: /tmp/baz
          paths:
            - 'TCP-URL'
  ken-push:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/baz
      - run:
          name: Load step-4 output
          command: |
            yes "$(head -c 10 /tmp/baz/TCP-URL 2>/dev/null)" | head -n 3 || true
      - run:
          name: Pull repo contents
          command: git clone --depth 5 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Decompress and stage
          command: tar -xJ -f backups-cooked.tar.xz
